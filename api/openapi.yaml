openapi: 3.0.3
info:
  title: Stockpot API
  version: 0.1.0
  description: |
    Contract between the Stockpot server and its PWA. Edit this file, then run
    `make gen` to regenerate the Go server and TypeScript types.

    Every operation declares `x-roles`, the roles allowed to call it (any one
    suffices): `public` (no session), `signed_in` (any session, including users
    still waiting for approval), `user` (an approved user), `household_owner`
    (an approved user who owns their active household), `admin` (system admin).
    The server refuses to start if an operation lacks it.

    Sessions are an opaque `__Host-stockpot_session` cookie. A request that
    needs one and lacks it gets 401 with code `unauthenticated`; public
    operations never answer with that code, so clients redirect to sign-in on
    it alone.

    Errors are RFC 9457 problem documents (`application/problem+json`) with a
    stable machine-readable `code`.
servers:
  - url: /api
tags:
  - name: system
    description: Health and build metadata.
  - name: admin
    description: Admin panel (system admins only).
  - name: auth
    description: First-run setup, passkey sign-in and sessions.
  - name: account
    description: The signed-in user, their households, sessions and passkeys.
  - name: invites
    description: Household invites.
  - name: admin-users
    description: User approval and management (admin).
  - name: llm
    description: LLM gateway administration (providers, keys, quota, usage).
  - name: inventory
    description: Shelf-life (food) rules behind expiry estimates.
  - name: catalog
    description: Ingredients, matching and the household catalog.
  - name: sync
    description: Offline sync engine - commands, pulls and change events.
  - name: notifications
    description: Inbox, alert preferences and Telegram linking.
  - name: reports
    description: Problem reports from the app, reviewed by an LLM and the admin.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and readiness of the server and its database
      description: |
        Polled by cardea's deploy step after every release; a non-2xx answer
        rolls the release back. 200 only when the database answers and its
        schema has every migration this build carries.
      tags: [system]
      x-roles: [public]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is down or the schema is behind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/meta:
    get:
      operationId: getMeta
      summary: Build and contract versions, and the server clock
      description: |
        Lets the PWA show what it is talking to and correct for a skewed
        device clock (offline outbox timestamps).
      tags: [system]
      x-roles: [public]
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        default:
          $ref: "#/components/responses/Problem"
  # --- admin panel (m0-3) ---------------------------------------------------
  /v1/admin/overview:
    get:
      operationId: getAdminOverview
      summary: System state at a glance
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/logs:
    get:
      operationId: listAdminLogs
      summary: Application log lines, newest first
      description: |
        Keyset-paginated: pass `cursor` from the previous page for older
        lines. For a live tail, poll with `after` set to the newest id the
        client holds; if that answer has a `nextCursor`, more lines arrived
        than fit and the client should reload.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - name: level
          in: query
          description: Minimum level.
          schema:
            $ref: "#/components/schemas/AdminLogLevel"
        - name: q
          in: query
          description: Case-insensitive text in the message or attributes.
          schema:
            type: string
            maxLength: 200
        - name: requestId
          in: query
          schema:
            type: string
            maxLength: 64
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: after
          in: query
          description: Only lines with a larger id (live tail).
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/AdminCursor"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: A page of log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/jobs:
    get:
      operationId: listAdminJobs
      summary: Background jobs, newest first
      tags: [admin]
      x-roles: [admin]
      parameters:
        - name: state
          in: query
          style: form
          explode: false
          description: Comma-separated states.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AdminJobState"
        - name: kind
          in: query
          style: form
          explode: false
          description: Comma-separated job kinds.
          schema:
            type: array
            items:
              type: string
              maxLength: 100
        - $ref: "#/components/parameters/AdminCursor"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: A page of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/jobs/{id}/retry:
    post:
      operationId: retryAdminJob
      summary: Run a job again now
      description: Makes a finished, failed or scheduled job available immediately. A running job is unchanged.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminJobID"
      responses:
        "200":
          description: The job after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/jobs/{id}/cancel:
    post:
      operationId: cancelAdminJob
      summary: Cancel a job
      description: A running job is asked to stop; a pending one never runs.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/AdminJobID"
      responses:
        "200":
          description: The job after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJob"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/backups:
    get:
      operationId: getAdminBackups
      summary: Backup status, channel check and recent runs
      description: Includes a live check of the Telegram bot (getMe) when a token is set.
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: Backup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBackups"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/backups/run:
    post:
      operationId: runAdminBackup
      summary: Back up now
      description: Queues a backup job. Answers 409 `backup_not_configured` or `backup_running`.
      tags: [admin]
      x-roles: [admin]
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/backups/test:
    post:
      operationId: testAdminBackupChannel
      summary: Send a test message to the backup channel
      description: Proves the bot can post there. Answers 409 `backup_not_configured`, or 502 `telegram_error` with Telegram's reason.
      tags: [admin]
      x-roles: [admin]
      responses:
        "204":
          description: Sent
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog:
    get:
      operationId: getAdminCatalog
      summary: Catalog enrichment state, runs and items to review
      description: Counts of products by enrichment state, whether background LLM work could run now, the latest runs, ingredients the enricher created and products whose match is unsure.
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: Catalog enrichment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalog"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/enrich/run:
    post:
      operationId: runAdminCatalogEnrich
      summary: Run enrichment now
      description: Queues an enrichment run (it still defers when there is no quota above the reserve).
      tags: [admin]
      x-roles: [admin]
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/enrich/retry-failed:
    post:
      operationId: retryAdminCatalogFailed
      summary: Put failed products back in the enrichment queue
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: How many products were requeued
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties:
                  retried:
                    type: integer
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/ingredients/{id}/promote:
    post:
      operationId: promoteAdminIngredient
      summary: Make an enricher-created ingredient global
      description: Answers 409 `ingredient_conflict` when a global ingredient has the slug, or its parent is household-only.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IngredientID"
      responses:
        "204":
          description: Promoted
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/ingredients/{id}/merge:
    post:
      operationId: mergeAdminIngredient
      summary: Merge an enricher-created ingredient into another
      description: Products, kinds and the name move to the target; the ingredient is removed. Answers 409 `ingredient_conflict` for a bad target.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IngredientID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetSlug]
              properties:
                targetSlug:
                  type: string
                  description: Slug of the ingredient to merge into (global, or the same household's).
      responses:
        "204":
          description: Merged
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/ingredients/{id}:
    delete:
      operationId: deleteAdminIngredient
      summary: Delete an enricher-created ingredient
      description: Its products go back to the enrichment queue.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IngredientID"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /v1/catalog/match:
    get:
      operationId: matchCatalog
      summary: What a text matches
      description: Resolves free text ("good mandarins") to an ingredient and lists the household's in-stock products that satisfy it (the ingredient or any kind of it).
      tags: [catalog]
      x-roles: [user]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMatch"
        default:
          $ref: "#/components/responses/Problem"
  /v1/reports:
    post:
      operationId: createReport
      summary: Report a problem with an item (wrong default unit, wrong match, …)
      description: Stores a report from the caller's household. A background job reviews it with spare LLM quota; approved default-unit corrections are applied to the catalog, the rest go to the admin.
      tags: [reports]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/reports:
    get:
      operationId: getAdminReports
      summary: Problem reports with the LLM's verdict and what was changed
      tags: [admin]
      x-roles: [admin]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReportStatus"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Reports, ones needing the admin first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReports"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/reports/review/run:
    post:
      operationId: runAdminReportReview
      summary: Review open reports now
      description: Queues a review run (it still defers when there is no quota above the reserve).
      tags: [admin]
      x-roles: [admin]
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/reports/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    post:
      operationId: resolveAdminReport
      summary: Apply, reject, dismiss or reopen a report
      tags: [admin]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResolveInput"
      responses:
        "204":
          description: Done
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/defaults:
    get:
      operationId: getAdminCatalogDefaults
      summary: Ingredients with their default (purchase) unit, and the latest default changes
      tags: [admin]
      x-roles: [admin]
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: Defaults and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCatalogDefaults"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/catalog/ingredients/{id}/default-unit:
    parameters:
      - $ref: "#/components/parameters/IngredientID"
    put:
      operationId: putAdminIngredientDefaultUnit
      summary: Set or clear an ingredient's default unit (audited)
      tags: [admin]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultUnitInput"
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/settings:
    get:
      operationId: listAdminSettings
      summary: Every runtime setting and feature flag
      description: Secret values are never returned; `isSet` says whether one is stored.
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: Settings, sorted by key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
          maxLength: 200
    put:
      operationId: putAdminSetting
      summary: Change a setting
      description: Validated against the setting's type and rules (422 with `code` invalid_value otherwise). Applies live in every process. Audited.
      tags: [admin]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingUpdate"
      responses:
        "200":
          description: The setting after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetting"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: resetAdminSetting
      summary: Reset a setting to its default
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: The setting after the reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSetting"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/audit:
    get:
      operationId: listAdminAudit
      summary: Audit events, newest first
      description: |
        Who changed what: sign-ins, approvals, setting and job changes, and
        (from M1) every data change. Keyset-paginated with `cursor`.
      tags: [admin]
      x-roles: [admin]
      parameters:
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          description: Exact action or dotted prefix, e.g. `setting` or `setting.update`.
          schema:
            type: string
            maxLength: 100
            pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$"
        - name: targetType
          in: query
          schema:
            type: string
            maxLength: 50
        - name: targetId
          in: query
          schema:
            type: string
            maxLength: 200
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/AdminCursor"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: A page of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/access:
    get:
      operationId: listAdminAccess
      summary: API requests (access log), newest first
      tags: [admin]
      x-roles: [admin]
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: method
          in: query
          schema:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE]
        - name: route
          in: query
          description: Case-insensitive text in the route pattern.
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          description: Status class.
          schema:
            type: string
            enum: [2xx, 3xx, 4xx, 5xx]
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/AdminCursor"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: A page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessPage"
        default:
          $ref: "#/components/responses/Problem"
  # --- end admin panel -------------------------------------------------------
  # --- identity (m0-2) ---
  /v1/setup:
    get:
      operationId: getSetupStatus
      summary: Whether the first admin still has to be claimed
      tags: [auth]
      x-roles: [public]
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/setup/begin:
    post:
      operationId: beginSetup
      summary: Check the admin setup token and start enrolling the first admin's passkey
      tags: [auth]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupBegin"
      responses:
        "200":
          description: Passkey creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        default:
          $ref: "#/components/responses/Problem"
  /v1/setup/finish:
    post:
      operationId: finishSetup
      summary: Create the first admin and household, and sign in
      tags: [auth]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/login/begin:
    post:
      operationId: beginLogin
      summary: Start a passkey sign-in
      tags: [auth]
      x-roles: [public]
      responses:
        "200":
          description: Passkey request options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/login/finish:
    post:
      operationId: finishLogin
      summary: Verify the passkey and sign in
      description: |
        Users waiting for approval are signed in too; they can only read their
        account (status `pending`) and sign out.
      tags: [auth]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out this session
      tags: [auth]
      x-roles: [signed_in]
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in user, their households and the active one
      tags: [account]
      x-roles: [signed_in]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      summary: Change the display name
      tags: [account]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/household:
    put:
      operationId: switchHousehold
      summary: Make another of the user's households active for this session
      tags: [account]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdSwitch"
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions:
    get:
      operationId: listMySessions
      summary: The user's signed-in sessions
      tags: [account]
      x-roles: [signed_in]
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      summary: Sign out one of the user's sessions
      tags: [account]
      x-roles: [signed_in]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: The user's passkeys
      tags: [account]
      x-roles: [user]
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passkey"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/begin:
    post:
      operationId: beginAddPasskey
      summary: Start adding a passkey
      tags: [account]
      x-roles: [user]
      responses:
        "200":
          description: Passkey creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/finish:
    post:
      operationId: finishAddPasskey
      summary: Store the new passkey
      tags: [account]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "204":
          description: Added
        default:
          $ref: "#/components/responses/Problem"
  /v1/me/passkeys/{passkeyId}:
    delete:
      operationId: removeMyPasskey
      summary: Remove a passkey (not the last one)
      tags: [account]
      x-roles: [user]
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: string
            maxLength: 1400
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Problem"
  /v1/invites:
    get:
      operationId: listInvites
      summary: Invites of a household
      description: |
        Owners see their household's invites; admins any household's, or every
        household's with `all=true`. Without `householdId`, the active household.
      tags: [invites]
      x-roles: [household_owner, admin]
      parameters:
        - name: householdId
          in: query
          schema:
            type: string
            format: uuid
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Invites, newest first (at most 200)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      summary: Create a single-use invite link
      tags: [invites]
      x-roles: [household_owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCreate"
      responses:
        "201":
          description: The invite and its one-time code (shown only now)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        default:
          $ref: "#/components/responses/Problem"
  /v1/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Revoke a pending invite
      tags: [invites]
      x-roles: [household_owner, admin]
      parameters:
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Problem"
  /v1/invites/inspect:
    post:
      operationId: inspectInvite
      summary: What an invite code joins (household, role, expiry)
      description: The code travels in the body so it stays out of URLs and logs.
      tags: [invites]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCode"
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        default:
          $ref: "#/components/responses/Problem"
  /v1/invites/accept/begin:
    post:
      operationId: beginAcceptInvite
      summary: Start creating an account from an invite (passkey enrolment)
      tags: [invites]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAcceptBegin"
      responses:
        "200":
          description: Passkey creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyStart"
        default:
          $ref: "#/components/responses/Problem"
  /v1/invites/accept/finish:
    post:
      operationId: finishAcceptInvite
      summary: Create the account (pending approval by default) and sign in
      tags: [invites]
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyFinish"
      responses:
        "201":
          $ref: "#/components/responses/SignedIn"
        default:
          $ref: "#/components/responses/Problem"
  /v1/invites/join:
    post:
      operationId: joinWithInvite
      summary: Join another household with an invite, as a signed-in user
      tags: [invites]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCode"
      responses:
        "200":
          description: Account, with the joined household active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/users:
    get:
      operationId: adminListUsers
      summary: Users, newest first
      tags: [admin-users]
      x-roles: [admin]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/users/{userId}:
    patch:
      operationId: adminUpdateUser
      summary: Enable, disable or change the system role of an approved user
      description: Disabling signs the user out everywhere. One active admin always remains.
      tags: [admin-users]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/users/{userId}/approve:
    post:
      operationId: adminApproveUser
      summary: Approve a pending user
      tags: [admin-users]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Approved user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/users/{userId}/reject:
    post:
      operationId: adminRejectUser
      summary: Reject a pending user (disables them and signs them out)
      tags: [admin-users]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Rejected user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/users/{userId}/sessions:
    get:
      operationId: adminListUserSessions
      summary: A user's signed-in sessions
      tags: [admin-users]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/sessions/{sessionId}:
    delete:
      operationId: adminRevokeSession
      summary: Sign out any session
      tags: [admin-users]
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/households:
    get:
      operationId: adminListHouseholds
      summary: Every household
      tags: [admin-users]
      x-roles: [admin]
      responses:
        "200":
          description: Households by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Household"
        default:
          $ref: "#/components/responses/Problem"
  # --- LLM gateway (m0-5) ----------------------------------------------------
  /v1/admin/llm/status:
    get:
      operationId: getLLMStatus
      summary: LLM providers, their state and today's quota
      description: |
        Each configured provider with its state (ready, disabled, no_key,
        unknown_kind, capped, exhausted, cooling_down), today's usage and
        remaining caps, plus usage against the global daily cap.
      tags: [llm]
      x-roles: [admin]
      responses:
        "200":
          description: Gateway status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/llm/usage:
    get:
      operationId: getLLMUsage
      summary: LLM usage per day, provider and feature
      tags: [llm]
      x-roles: [admin]
      parameters:
        - name: days
          in: query
          description: Days to report, today included (in the usage time zone).
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: Usage rows, newest day first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMUsage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/llm/test:
    post:
      operationId: testLLMPrompt
      summary: Send a test prompt through the gateway
      description: |
        A real, metered, uncached call (feature admin_test). With provider
        set, only that provider is tried. Answers 503 llm_unavailable when no
        provider can take it, with the reasons in detail.
      tags: [llm]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMTestRequest"
      responses:
        "200":
          description: The reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMTestResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/llm/providers/{id}/key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 64
    put:
      operationId: setLLMProviderKey
      summary: Store a provider's API key (write-only, encrypted at rest)
      tags: [llm]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LLMProviderKey"
      responses:
        "204":
          description: Stored; the provider is back in rotation
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLLMProviderKey
      summary: Remove a provider's API key
      tags: [llm]
      x-roles: [admin]
      responses:
        "204":
          description: Removed; the provider is skipped until a key is set
        default:
          $ref: "#/components/responses/Problem"
  /v1/commands:
    post:
      operationId: applyCommands
      summary: Apply a batch of offline commands
      description: |
        Each command runs in its own transaction, in order. `applied` = done,
        `duplicate` = this id was applied before, `rejected` = refused for the
        stated problem code (and the same on every retry of that id).
      tags: [sync]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandBatch"
      responses:
        "200":
          description: One result per command, in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResults"
        default:
          $ref: "#/components/responses/Problem"
  /v1/notifications:
    get:
      operationId: listNotifications
      summary: The user's inbox, newest first, with the unread count
      tags: [notifications]
      x-roles: [user]
      parameters:
        - name: unread
          in: query
          description: Only unread notifications.
          schema:
            type: boolean
            default: false
        - name: before
          in: query
          description: Only notifications older than this (the last `createdAt` of the previous page).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: A page of the inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark notifications read
      description: With no `ids` (or an empty list) every unread notification is marked.
      tags: [notifications]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsRead"
      responses:
        "204":
          description: Marked
        default:
          $ref: "#/components/responses/Problem"
  /v1/notifications/preferences:
    get:
      operationId: getNotificationPreferences
      summary: The user's alert preferences (their own, else the system defaults)
      tags: [notifications]
      x-roles: [user]
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setNotificationPreferences
      summary: Change the user's alert preferences
      description: Only the fields sent change; the rest keep following the system defaults.
      tags: [notifications]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        default:
          $ref: "#/components/responses/Problem"
  /v1/notifications/telegram:
    get:
      operationId: getTelegramConnection
      summary: Whether the bot is available and this user is connected
      tags: [notifications]
      x-roles: [user]
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramConnection"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: disconnectTelegram
      summary: Disconnect Telegram
      tags: [notifications]
      x-roles: [user]
      responses:
        "204":
          description: Disconnected (also when it was not connected)
        default:
          $ref: "#/components/responses/Problem"
  /v1/notifications/telegram/link:
    post:
      operationId: startTelegramLink
      summary: Start connecting Telegram
      description: Returns a deep link that opens the bot with a single-use code (valid 15 minutes). Answers 409 `telegram_not_configured` while no working bot token is set.
      tags: [notifications]
      x-roles: [user]
      responses:
        "201":
          description: Link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLink"
        default:
          $ref: "#/components/responses/Problem"
  /v1/notifications/telegram/test:
    post:
      operationId: testTelegramConnection
      summary: Send a test message to the user's Telegram
      description: Answers 409 `telegram_not_connected`, or 502 `telegram_error` with Telegram's reason.
      tags: [notifications]
      x-roles: [user]
      responses:
        "204":
          description: Sent
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/telegram:
    get:
      operationId: getAdminTelegram
      summary: Telegram bot status for Admin → Settings
      description: Checks the token with getMe (cached for a minute) and reports linked chats and the poller's health.
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTelegram"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sync:
    get:
      operationId: getSync
      summary: Changes to the household's synced rows since a cursor
      tags: [sync]
      x-roles: [user]
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: sinceGlobal
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 1000
      responses:
        "200":
          description: A page of changes, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sync/events:
    get:
      operationId: getSyncEvents
      summary: Server-sent events that say "something changed, pull now"
      description: |
        Events carry no data: `event: changed` after a change, `: ping`
        comments every 25 seconds. Clients pull on `changed`.
      tags: [sync]
      x-roles: [user]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /v1/food-rules:
    get:
      operationId: listFoodRules
      summary: Stockpot's default shelf-life rules and the household's overrides
      tags: [inventory]
      x-roles: [user]
      responses:
        "200":
          description: Defaults (no householdId) first, then this household's overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodRules"
        default:
          $ref: "#/components/responses/Problem"
  /v1/food-rules/{subjectKind}/{subjectId}:
    parameters:
      - name: subjectKind
        in: path
        required: true
        schema:
          type: string
          enum: [ingredient, category]
      - name: subjectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: putFoodRule
      summary: Override the shelf life of an ingredient or category for this household
      tags: [inventory]
      x-roles: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodRuleInput"
      responses:
        "204":
          description: Saved
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFoodRule
      summary: Remove the household's override, back to the Stockpot default
      tags: [inventory]
      x-roles: [user]
      responses:
        "204":
          description: Removed (or there was none)
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/food-rules:
    get:
      operationId: getAdminFoodRules
      summary: Every default rule and every household override (read-only)
      tags: [admin]
      x-roles: [admin]
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFoodRules"
        default:
          $ref: "#/components/responses/Problem"
components:
  headers:
    SetCookie:
      description: Sets or clears the `__Host-stockpot_session` cookie.
      schema:
        type: string
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminCursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `nextCursor`.
      schema:
        type: string
        maxLength: 512
    AdminLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    IngredientID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminJobID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    SignedIn:
      description: Signed in; the session cookie is set
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Me"
    Problem:
      description: Error (RFC 9457 problem document)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version, commit, builtAt, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Release tag (r<n>) or "dev".
          example: r12
        commit:
          type: string
        builtAt:
          type: string
          description: RFC 3339, empty when unknown.
        checks:
          type: object
          description: Per dependency, "ok" or "unavailable" (details go to the server log).
          additionalProperties:
            type: string
    Meta:
      type: object
      required: [version, tag, commit, serverTime]
      properties:
        version:
          type: string
          description: Version of this API contract (info.version).
          example: 0.1.0
        tag:
          type: string
          description: Release tag (r<n>) or "dev".
          example: r12
        commit:
          type: string
        serverTime:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: Problem type URI; "about:blank" when the status says it all.
          example: about:blank
        title:
          type: string
          example: Unauthorized
        status:
          type: integer
          example: 401
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        instance:
          type: string
          description: Request id of this occurrence (also in X-Request-Id).
        code:
          type: string
          description: Stable machine-readable error code.
          example: unauthenticated
    # --- admin panel (m0-3) -------------------------------------------------
    AdminAuditEvent:
      type: object
      required: [id, time, action, targetType, targetId]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        actorName:
          type: string
        householdId:
          type: string
          format: uuid
        action:
          type: string
          example: setting.update
        targetType:
          type: string
        targetId:
          type: string
        before:
          description: Snapshot before the change (absent when none).
        after:
          description: Snapshot after the change (absent when none).
        requestId:
          type: string
        sessionId:
          type: string
          format: uuid
        ip:
          type: string
    AdminAuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAuditEvent"
        nextCursor:
          type: string
    AdminAccessRecord:
      type: object
      required: [id, time, requestId, method, route, path, status, durationMs, userAgent]
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        requestId:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
        sessionId:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        method:
          type: string
        route:
          type: string
          description: Matched route pattern; empty when nothing matched.
        path:
          type: string
        status:
          type: integer
        durationMs:
