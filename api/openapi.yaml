    LLMProviderConfig:
      type: object
      description: One entry of the llm.providers setting.
      required: [id, kind, base_url, model, vision, json_schema, enabled, daily_request_cap, daily_token_cap, reset_tz]
      properties:
        id:
          type: string
        kind:
          type: string
          description: Adapter, e.g. openai_compat.
        base_url:
          type: string
        model:
          type: string
        vision:
          type: boolean
        json_schema:
          type: boolean
        enabled:
          type: boolean
        daily_request_cap:
          type: integer
          description: 0 = no cap.
        daily_token_cap:
          type: integer
          description: 0 = no cap.
        reset_tz:
          type: string
          description: IANA zone whose midnight resets the daily quota.
        timeout_seconds:
          type: integer
    LLMProviderStatus:
      type: object
      required: [config, hasKey, state, requestsToday, tokensToday, resetAt]
      properties:
        config:
          $ref: "#/components/schemas/LLMProviderConfig"
        hasKey:
          type: boolean
        state:
          type: string
          description: ready, disabled, no_key, unknown_kind, capped, exhausted or cooling_down.
        detail:
          type: string
          description: Why the provider isn't ready.
        until:
          type: string
          format: date-time
          description: When a capped, exhausted or cooling_down provider returns.
        requestsToday:
          type: integer
          format: int64
        tokensToday:
          type: integer
          format: int64
        remainingRequests:
          type: integer
          format: int64
          description: Absent without a request cap.
        remainingTokens:
          type: integer
          format: int64
          description: Absent without a token cap.
        resetAt:
          type: string
          format: date-time
    LLMStatus:
      type: object
      required: [enabled, available, vision, providers, tz, requestsToday, tokensToday, globalRequestCap, resetAt]
      properties:
        enabled:
          type: boolean
          description: flag.llm_enabled.
        available:
          type: boolean
          description: A text request could be served now.
        vision:
          type: boolean
          description: A request with images could be served now.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/LLMProviderStatus"
        tz:
          type: string
          description: Zone of the global daily cap (llm.usage_tz).
        requestsToday:
          type: integer
          format: int64
        tokensToday:
          type: integer
          format: int64
        globalRequestCap:
          type: integer
          description: 0 = no cap.
        globalRemaining:
          type: integer
          format: int64
        resetAt:
          type: string
          format: date-time
    LLMUsageRow:
      type: object
      required: [day, provider, feature, requests, cacheHits, failures, tokensIn, tokensOut, avgLatencyMs]
      properties:
        day:
          type: string
          format: date
        provider:
          type: string
        feature:
          type: string
        requests:
