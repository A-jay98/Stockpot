# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: httpapi
output: api.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
  embedded-spec: true
  server-urls: true
compatibility:
  # Enum constants are package-level; prefix them with their type
  # (HealthStatusOk, AdminLogLevelError) so areas can't collide.
  always-prefix-enum-values: true
